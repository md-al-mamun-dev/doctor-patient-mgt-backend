openapi: 3.1.0
info:
  title: Doctor & Patient Management System API
  version: 1.0.0
  description: |
    Comprehensive RESTful API for healthcare administration managing doctor records, 
    patient assignments, authentication, and clinical analytics.
servers:
  - url: /api/v1
    description: Current Environment Base API

tags:
  - name: Auth
    description: Authentication, session management, and current user profile
  - name: Users
    description: User and staff account administration, role assignment, and session control (Admin only)
  - name: Doctors
    description: Doctor registry, specialty filters, and profile operations
  - name: Patients
    description: Patient registry, medical records, and doctor assignments
  - name: Dashboard
    description: Aggregate clinical metrics and distribution statistics

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new user
      description: Creates a user account with assigned role (admin, doctor, patient) and issues an HttpOnly session cookie and JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: User login
      description: Verifies credentials and sets an HttpOnly JWT authentication cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate refresh token session
      description: Swaps the single-use refresh token for a new one and issues a refreshed access token. Token reuse immediately terminates the entire session family.
      responses:
        '200':
          description: Session refreshed successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [session]
                    properties:
                      session:
                        $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: User logout
      description: Ends the current session family, clears cookies, and signals client storage cleanup.
      responses:
        '204':
          description: Logged out successfully. Cookies cleared.
          headers:
            Clear-Site-Data:
              schema:
                type: string
                example: '"cookies", "storage"'

  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAllSessions
      summary: End all sessions on all devices
      description: Revokes all active refresh token families for the authenticated user and clears local cookies.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: All sessions revoked successfully.

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get current authenticated user
      description: Returns the authenticated user profile and active session expiration metadata. Accessible even when a password change is pending.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      session:
                        $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change user password
      description: Updates the user password with Argon2id, revokes other device sessions, and lifts first-login password change lock.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List staff and admin accounts
      description: Returns a paginated list of user accounts with optional filtering by role, status, and prefix search. Admin only.
      parameters:
        - name: page
          in: query
          description: Page number (1 or greater)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of records per page (up to 100)
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: q
          in: query
          description: Search by name or email prefix
          schema:
            type: string
        - name: role
          in: query
          description: Comma-separated list of roles to filter (admin, staff)
          schema:
            type: string
            example: staff
        - name: status
          in: query
          description: Comma-separated list of statuses to filter (active, disabled)
          schema:
            type: string
            example: active
        - name: sort
          in: query
          description: Sort field (name, -createdAt, -lastLoginAt)
          schema:
            type: string
            enum: [name, -createdAt, -lastLoginAt]
            default: -createdAt
      responses:
        '200':
          description: List of user accounts retrieved successfully
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      tags: [Users]
      operationId: createUser
      summary: Create an account
      description: Creates a new staff or admin account with an automatically generated one-time temporary password. The user must change their password upon first sign-in. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User account created successfully
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/users/6722c41fa8e03b17d95c0a62
            ETag:
              schema:
                type: string
                example: '"1"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /users/{id}:
    get:
      tags: [Users]
      operationId: getUserById
      summary: Get user account details
      description: Retrieves complete details of a specific user account. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          description: 24-character hexadecimal MongoDB ObjectId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 6722c41fa8e03b17d95c0a62
      responses:
        '200':
          description: User account retrieved successfully
          headers:
            ETag:
              schema:
                type: string
                example: '"1"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags: [Users]
      operationId: updateUser
      summary: Edit user account
      description: Modifies name, role, or status of an existing user account. Demoting or disabling an account immediately terminates all active sessions. Optimistic concurrency control via If-Match header is mandatory. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          description: 24-character hexadecimal MongoDB ObjectId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 6722c41fa8e03b17d95c0a62
        - name: If-Match
          in: header
          required: true
          description: Current document version enclosed in quotes (e.g. "1")
          schema:
            type: string
            example: '"1"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User account updated successfully
          headers:
            ETag:
              schema:
                type: string
                example: '"2"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'

  /users/{id}/reset-password:
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Admin password reset
      description: Generates a new 20-character temporary password, enforces password change at next sign-in, and terminates all existing sessions for the target account. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          description: 24-character hexadecimal MongoDB ObjectId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 6722c41fa8e03b17d95c0a62
      responses:
        '200':
          description: Password reset successfully, temporary password returned
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/{id}/unlock:
    post:
      tags: [Users]
      operationId: unlockUserAccount
      summary: Unlock user account
      description: Clears failed login counter and unlocks an account locked due to excessive failed sign-in attempts. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          description: 24-character hexadecimal MongoDB ObjectId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 6722c41fa8e03b17d95c0a62
      responses:
        '204':
          description: Account unlocked successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/{id}/revoke-sessions:
    post:
      tags: [Users]
      operationId: revokeUserSessions
      summary: Revoke all active sessions
      description: Immediately invalidates all refresh tokens and sessions across all devices for the target user. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          description: 24-character hexadecimal MongoDB ObjectId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 6722c41fa8e03b17d95c0a62
      responses:
        '204':
          description: All user sessions revoked successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /doctors/options:
    get:
      tags: [Doctors]
      operationId: getDoctorOptions
      summary: Up to 20 doctor options for dropdown pickers
      description: Returns lightweight doctor options (id, name, specialization) matching prefix search q.
      parameters:
        - name: q
          in: query
          description: Search doctor by name or specialization prefix
          schema:
            type: string
      responses:
        '200':
          description: List of doctor options
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DoctorOption'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /doctors/facets:
    get:
      tags: [Doctors]
      operationId: getDoctorFacets
      summary: Unique specializations and hospitals
      description: Returns sorted distinct specializations and hospitals currently in use for filter menus.
      responses:
        '200':
          description: Facet lists retrieved successfully
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorFacetsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /doctors:
    get:
      tags: [Doctors]
      operationId: listDoctors
      summary: List doctors with patient counts
      description: Retrieves paginated doctor records with search and filters by specialization, hospital, and creation date.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: q
          in: query
          description: Search prefix against doctor name, specialization, hospital, or phone
          schema:
            type: string
        - name: specialization
          in: query
          description: Filter by specialization (supports comma-separated list)
          schema:
            type: string
        - name: hospital
          in: query
          description: Filter by hospital (supports comma-separated list)
          schema:
            type: string
        - name: from
          in: query
          description: Created after calendar date (YYYY-MM-DD)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          description: Created before calendar date (YYYY-MM-DD)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: sort
          in: query
          schema:
            type: string
            enum: [-createdAt, createdAt, name, -name, -patientCount]
            default: -createdAt
      responses:
        '200':
          description: Doctors retrieved successfully
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags: [Doctors]
      operationId: createDoctor
      summary: Add a new doctor
      description: Registers a new doctor with initial patientCount of 0. Requires Admin privileges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDoctorRequest'
      responses:
        '201':
          description: Doctor created successfully
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/doctors/6702e91b3c5d4fa8e1b06c33
            ETag:
              schema:
                type: string
                example: '"1"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleDoctorResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /doctors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Doctor MongoDB ObjectId
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 6702e91b3c5d4fa8e1b06c33
    get:
      tags: [Doctors]
      operationId: getDoctorById
      summary: One doctor profile
      description: Retrieves doctor profile with current patientCount and version.
      responses:
        '200':
          description: Doctor retrieved successfully
          headers:
            ETag:
              schema:
                type: string
                example: '"3"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleDoctorResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags: [Doctors]
      operationId: updateDoctor
      summary: Edit doctor profile
      description: Updates doctor details. When doctor is renamed, all associated patients are updated in the same transaction. Optimistic concurrency control via If-Match required. Admin only.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Current version enclosed in quotes (e.g. "3")
          schema:
            type: string
            example: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDoctorRequest'
      responses:
        '200':
          description: Doctor updated successfully
          headers:
            ETag:
              schema:
                type: string
                example: '"4"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleDoctorResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'

  /doctors/{id}/summary:
    parameters:
      - name: id
        in: path
        required: true
        description: Doctor MongoDB ObjectId
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
    get:
      tags: [Doctors]
      operationId: getDoctorSummary
      summary: Doctor profile summary counts
      description: Computes total patientCount, breakdown by clinical condition, admitted this month count, and last admission date.
      responses:
        '200':
          description: Summary computed successfully
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorSummaryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /doctors/{id}/patients:
    parameters:
      - name: id
        in: path
        required: true
        description: Doctor MongoDB ObjectId
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
    get:
      tags: [Doctors]
      operationId: getDoctorPatients
      summary: List patients of a doctor
      description: Returns paginated patients admitted under this doctor with condition and date filters.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: q
          in: query
          schema:
            type: string
        - name: condition
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [-admissionDate, admissionDate, name]
            default: -admissionDate
      responses:
        '200':
          description: Doctor patients retrieved successfully
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    post:
      tags: [Doctors]
      operationId: createDoctorPatient
      summary: Add patient under doctor
      description: Creates a patient assigned to this doctor and increments the doctor patientCount in an atomic multi-document transaction. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Patient created successfully
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/patients/6721b0c4e1f2a39d8c4b7e10
            ETag:
              schema:
                type: string
                example: '"1"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglePatientResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /patients:
    get:
      tags: [Patients]
      operationId: listPatients
      summary: List patients
      description: Retrieves paginated patient records across doctors with optional filters. Internal notes are omitted from list queries.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: doctorId
          in: query
          schema:
            type: string
        - name: condition
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [-admissionDate, admissionDate, name]
            default: -admissionDate
      responses:
        '200':
          description: Patients retrieved successfully
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /patients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Patient MongoDB ObjectId
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 6721b0c4e1f2a39d8c4b7e10
    get:
      tags: [Patients]
      operationId: getPatientById
      summary: One patient record
      description: Retrieves complete patient profile including clinical notes and assigned doctor name.
      responses:
        '200':
          description: Patient retrieved successfully
          headers:
            ETag:
              schema:
                type: string
                example: '"1"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglePatientResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags: [Patients]
      operationId: updatePatient
      summary: Edit patient record
      description: Modifies patient fields. If doctorId changes, patient counts of both doctors are atomically updated in a transaction. Optimistic concurrency control via If-Match required. Admin only.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Current version enclosed in quotes (e.g. "1")
          schema:
            type: string
            example: '"1"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          description: Patient updated successfully
          headers:
            ETag:
              schema:
                type: string
                example: '"2"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglePatientResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'

    delete:
      tags: [Patients]
      operationId: deletePatient
      summary: Remove patient record
      description: Deletes patient record and decrements the assigned doctor patientCount in an atomic transaction. Admin only.
      responses:
        '204':
          description: Patient removed successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /dashboard/stats:
    get:
      tags: [Dashboard]
      operationId: getDashboardStats
      summary: Retrieve clinical dashboard analytics
      description: Returns aggregate counts of doctors, patients, and users, alongside specialty and gender distribution breakdowns.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: HttpOnly JWT authentication cookie set upon login/register.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authorization header Bearer token for API clients.

  schemas:
    StandardResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully

    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 5

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Dr. Sarah Connor
        email:
          type: string
          format: email
          example: sarah.connor@hospital.org
        password:
          type: string
          format: password
          minLength: 6
          example: SecurePass123!
        role:
          type: string
          enum: [admin, doctor, patient]
          default: patient

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@hospital.org
        password:
          type: string
          format: password
          example: AdminPass123!

    SessionInfo:
      type: object
      required: [startedAt, idleExpiresAt, expiresAt]
      properties:
        startedAt:
          type: string
          format: date-time
          example: '2026-10-30T03:00:00.000Z'
        idleExpiresAt:
          type: string
          format: date-time
          example: '2026-10-30T03:30:00.000Z'
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-30T11:00:00.000Z'

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          example: OldPassword123!
        newPassword:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          example: newSecurePass12345678!

    User:
      type: object
      required: [id, name, email, role, version]
      properties:
        id:
          type: string
          example: 671f0a2be4c1d9a07b3e5f21
        name:
          type: string
          example: Nadia Islam
        email:
          type: string
          format: email
          example: nadia.islam@doctortracker.dev
        role:
          type: string
          enum: [admin, staff, doctor, patient]
          example: admin
        status:
          type: string
          enum: [active, disabled]
          example: active
        mustChangePassword:
          type: boolean
          example: false
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-30T06:00:00.000Z'
        version:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: '2026-10-30T05:12:44.120Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-30T05:12:44.120Z'

    CreateUserRequest:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Rakib Hossain
        email:
          type: string
          format: email
          example: rakib.hossain@doctortracker.dev
        role:
          type: string
          enum: [admin, staff]
          example: staff

    CreateUserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [user, temporaryPassword]
          properties:
            user:
              $ref: '#/components/schemas/User'
            temporaryPassword:
              type: string
              example: qT7v-Lm2x-Wc9k-Rp4z-Hb6n

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Rakib Hossain
        role:
          type: string
          enum: [admin, staff]
          example: staff
        status:
          type: string
          enum: [active, disabled]
          example: active

    ResetPasswordResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [temporaryPassword]
          properties:
            temporaryPassword:
              type: string
              example: qT7v-Lm2x-Wc9k-Rp4z-Hb6n

    UserListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    SingleUserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/User'

    AuthSuccessResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                _id:
                  type: string
                  example: 6512bd8f12a3456789abcde1
                name:
                  type: string
                  example: Admin User
                email:
                  type: string
                  example: admin@hospital.org
                role:
                  type: string
                  example: admin
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI...

    UserProfileResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Current user profile
        data:
          type: object
          properties:
            id:
              type: string
              example: 6512bd8f12a3456789abcde1
            role:
              type: string
              example: admin
            email:
              type: string
              example: admin@hospital.org

    Doctor:
      type: object
      required: [id, name, specialization, hospital, phone, email, patientCount, version]
      properties:
        id:
          type: string
          example: 6702e91b3c5d4fa8e1b06c33
        name:
          type: string
          example: Dr. Farhana Rahman
        specialization:
          type: string
          example: Cardiology
        hospital:
          type: string
          example: Square Hospital
        phone:
          type: string
          example: '+8801712345678'
        email:
          type: string
          format: email
          example: farhana.rahman@square.example
        patientCount:
          type: integer
          example: 74
        version:
          type: integer
          example: 3
        createdAt:
          type: string
          format: date-time
          example: '2026-01-18T04:20:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-12T09:41:07.000Z'

    DoctorOption:
      type: object
      required: [id, name, specialization]
      properties:
        id:
          type: string
          example: 6702e91b3c5d4fa8e1b06c33
        name:
          type: string
          example: Dr. Farhana Rahman
        specialization:
          type: string
          example: Cardiology

    DoctorFacetsResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [specializations, hospitals]
          properties:
            specializations:
              type: array
              items:
                type: string
              example: [Cardiology, Dermatology, Neurology, Pediatrics]
            hospitals:
              type: array
              items:
                type: string
              example: [Dhaka Medical College, Square Hospital, United Hospital]

    DoctorSummaryResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [patientCount, byCondition, admittedThisMonth, lastAdmissionDate]
          properties:
            patientCount:
              type: integer
              example: 74
            byCondition:
              type: object
              properties:
                stable:
                  type: integer
                  example: 31
                under_observation:
                  type: integer
                  example: 14
                critical:
                  type: integer
                  example: 3
                recovering:
                  type: integer
                  example: 15
                discharged:
                  type: integer
                  example: 11
            admittedThisMonth:
              type: integer
              example: 9
            lastAdmissionDate:
              type: string
              nullable: true
              example: '2026-10-29'

    CreateDoctorRequest:
      type: object
      required: [name, specialization, hospital, phone, email]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Dr. Farhana Rahman
        specialization:
          type: string
          minLength: 2
          maxLength: 100
          example: Cardiology
        hospital:
          type: string
          minLength: 2
          maxLength: 100
          example: Square Hospital
        phone:
          type: string
          example: '01712345678'
        email:
          type: string
          format: email
          example: farhana.rahman@square.example

    UpdateDoctorRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Prof. Dr. Farhana Rahman
        specialization:
          type: string
          minLength: 2
          maxLength: 100
          example: Interventional Cardiology
        hospital:
          type: string
          minLength: 2
          maxLength: 100
          example: Square Hospital
        phone:
          type: string
          example: '+8801712345678'
        email:
          type: string
          format: email
          example: farhana.rahman@square.example

    SingleDoctorResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Doctor'

    DoctorListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Doctor'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    Patient:
      type: object
      required: [id, name, age, gender, phone, condition, admissionDate, doctorId, doctorName, version]
      properties:
        id:
          type: string
          example: 6721b0c4e1f2a39d8c4b7e10
        name:
          type: string
          example: Tariq Anwar
        age:
          type: integer
          example: 48
        gender:
          type: string
          enum: [male, female, other]
          example: male
        phone:
          type: string
          example: '+8801819998877'
        email:
          type: string
          format: email
          example: tariq.anwar@example.com
        condition:
          type: string
          enum: [stable, under_observation, critical, recovering, discharged]
          example: stable
        diagnosis:
          type: string
          example: Hypertension Stage 2
        admissionDate:
          type: string
          example: '2026-10-25'
        notes:
          type: string
          example: Patient responding well to medication.
        doctorId:
          type: string
          example: 6702e91b3c5d4fa8e1b06c33
        doctorName:
          type: string
          example: Dr. Farhana Rahman
        version:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: '2026-10-25T08:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-25T08:30:00.000Z'

    CreatePatientRequest:
      type: object
      required: [name, age, gender, phone, condition, admissionDate]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Tariq Anwar
        age:
          type: integer
          minimum: 0
          maximum: 130
          example: 48
        gender:
          type: string
          enum: [male, female, other]
          example: male
        phone:
          type: string
          example: '01819998877'
        email:
          type: string
          format: email
          example: tariq.anwar@example.com
        condition:
          type: string
          enum: [stable, under_observation, critical, recovering, discharged]
          example: stable
        diagnosis:
          type: string
          maxLength: 200
          example: Hypertension Stage 2
        admissionDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-10-25'
        notes:
          type: string
          maxLength: 2000
          example: Patient responding well to medication.

    UpdatePatientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Tariq Anwar
        age:
          type: integer
          minimum: 0
          maximum: 130
          example: 49
        gender:
          type: string
          enum: [male, female, other]
          example: male
        phone:
          type: string
          example: '+8801819998877'
        email:
          type: string
          format: email
          example: tariq.anwar@example.com
        condition:
          type: string
          enum: [stable, under_observation, critical, recovering, discharged]
          example: recovering
        diagnosis:
          type: string
          maxLength: 200
          example: Hypertension Controlled
        admissionDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-10-25'
        notes:
          type: string
          maxLength: 2000
          example: Scheduled for discharge tomorrow.
        doctorId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 6702e91b3c5d4fa8e1b06c33

    SinglePatientResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Patient'

    PatientListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Patient'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    DashboardStatsResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Dashboard stats retrieved successfully
        data:
          type: object
          properties:
            overview:
              type: object
              properties:
                totalDoctors:
                  type: integer
                  example: 12
                totalPatients:
                  type: integer
                  example: 65
                totalUsers:
                  type: integer
                  example: 80
            specialtyDistribution:
              type: array
              items:
                type: object
                properties:
                  specialty:
                    type: string
                    example: Cardiology
                  count:
                    type: integer
                    example: 4
            genderDistribution:
              type: array
              items:
                type: object
                properties:
                  gender:
                    type: string
                    example: female
                  count:
                    type: integer
                    example: 35

    ErrorResponse:
      type: object
      required: [success, message, errors]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Resource not found
        errors:
          type: array
          items:
            type: string

  responses:
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Input validation failed
            errors:
              - path: email
                message: Invalid email address

    UnauthorizedError:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Authentication required
            errors: []

    ForbiddenError:
      description: Forbidden - Insufficient role permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 'Forbidden: Access denied'
            errors: []

    NotFoundError:
      description: Requested entity does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Doctor not found
            errors: []

    ConflictError:
      description: Conflict - Unique constraint violated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: A user with this email already exists
            errors: []

    RateLimitedError:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Too many requests. Please try again later.
            errors: []

    PreconditionFailedError:
      description: Precondition failed - Resource version mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 'Precondition failed: resource has been modified'
            errors: []

    PreconditionRequiredError:
      description: Precondition required - If-Match header missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: If-Match header is required for updates
            errors: []
