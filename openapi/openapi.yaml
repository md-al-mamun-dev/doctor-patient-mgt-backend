openapi: 3.1.0
info:
  title: Doctor & Patient Management System API
  version: 1.0.0
  description: |
    Comprehensive RESTful API for healthcare administration managing doctor records, 
    patient assignments, authentication, and clinical analytics.
servers:
  - url: /api/v1
    description: Current Environment Base API

tags:
  - name: Auth
    description: Authentication, session management, and current user profile
  - name: Users
    description: User and staff account administration, role assignment, and session control (Admin only)
  - name: Doctors
    description: Doctor registry, specialty filters, and profile operations
  - name: Patients
    description: Patient registry, medical records, and doctor assignments
  - name: Dashboard
    description: Aggregate clinical metrics and distribution statistics

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new user
      description: Creates a user account with assigned role (admin, doctor, patient) and issues an HttpOnly session cookie and JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: User login
      description: Verifies credentials and sets an HttpOnly JWT authentication cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate refresh token session
      description: Swaps the single-use refresh token for a new one and issues a refreshed access token. Token reuse immediately terminates the entire session family.
      responses:
        '200':
          description: Session refreshed successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [session]
                    properties:
                      session:
                        $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: User logout
      description: Ends the current session family, clears cookies, and signals client storage cleanup.
      responses:
        '204':
          description: Logged out successfully. Cookies cleared.
          headers:
            Clear-Site-Data:
              schema:
                type: string
                example: '"cookies", "storage"'

  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAllSessions
      summary: End all sessions on all devices
      description: Revokes all active refresh token families for the authenticated user and clears local cookies.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: All sessions revoked successfully.

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get current authenticated user
      description: Returns the authenticated user profile and active session expiration metadata. Accessible even when a password change is pending.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      session:
                        $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change user password
      description: Updates the user password with Argon2id, revokes other device sessions, and lifts first-login password change lock.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List staff and admin accounts
      description: Returns a paginated list of user accounts with optional filtering by role, status, and prefix search. Admin only.
      parameters:
        - name: page
          in: query
          description: Page number (1 or greater)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of records per page (up to 100)
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: q
          in: query
          description: Search by name or email prefix
          schema:
            type: string
        - name: role
          in: query
          description: Comma-separated list of roles to filter (admin, staff)
          schema:
            type: string
            example: staff
        - name: status
          in: query
          description: Comma-separated list of statuses to filter (active, disabled)
          schema:
            type: string
            example: active
        - name: sort
          in: query
          description: Sort field (name, -createdAt, -lastLoginAt)
          schema:
            type: string
            enum: [name, -createdAt, -lastLoginAt]
            default: -createdAt
      responses:
        '200':
          description: List of user accounts retrieved successfully
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      tags: [Users]
      operationId: createUser
      summary: Create an account
      description: Creates a new staff or admin account with an automatically generated one-time temporary password. The user must change their password upon first sign-in. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User account created successfully
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/users/6722c41fa8e03b17d95c0a62
            ETag:
              schema:
                type: string
                example: '"1"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /users/{id}:
    get:
      tags: [Users]
      operationId: getUserById
      summary: Get user account details
      description: Retrieves complete details of a specific user account. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          description: 24-character hexadecimal MongoDB ObjectId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 6722c41fa8e03b17d95c0a62
      responses:
        '200':
          description: User account retrieved successfully
          headers:
            ETag:
              schema:
                type: string
                example: '"1"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags: [Users]
      operationId: updateUser
      summary: Edit user account
      description: Modifies name, role, or status of an existing user account. Demoting or disabling an account immediately terminates all active sessions. Optimistic concurrency control via If-Match header is mandatory. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          description: 24-character hexadecimal MongoDB ObjectId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 6722c41fa8e03b17d95c0a62
        - name: If-Match
          in: header
          required: true
          description: Current document version enclosed in quotes (e.g. "1")
          schema:
            type: string
            example: '"1"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User account updated successfully
          headers:
            ETag:
              schema:
                type: string
                example: '"2"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'

  /users/{id}/reset-password:
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Admin password reset
      description: Generates a new 20-character temporary password, enforces password change at next sign-in, and terminates all existing sessions for the target account. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          description: 24-character hexadecimal MongoDB ObjectId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 6722c41fa8e03b17d95c0a62
      responses:
        '200':
          description: Password reset successfully, temporary password returned
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/{id}/unlock:
    post:
      tags: [Users]
      operationId: unlockUserAccount
      summary: Unlock user account
      description: Clears failed login counter and unlocks an account locked due to excessive failed sign-in attempts. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          description: 24-character hexadecimal MongoDB ObjectId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 6722c41fa8e03b17d95c0a62
      responses:
        '204':
          description: Account unlocked successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/{id}/revoke-sessions:
    post:
      tags: [Users]
      operationId: revokeUserSessions
      summary: Revoke all active sessions
      description: Immediately invalidates all refresh tokens and sessions across all devices for the target user. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          description: 24-character hexadecimal MongoDB ObjectId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 6722c41fa8e03b17d95c0a62
      responses:
        '204':
          description: All user sessions revoked successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /doctors:
    get:
      tags: [Doctors]
      operationId: listDoctors
      summary: List doctors
      description: Retrieves paginated doctor records with optional specialty and department filters.
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            default: 10
        - name: specialty
          in: query
          description: Filter by specialty regex
          schema:
            type: string
        - name: department
          in: query
          description: Filter by department regex
          schema:
            type: string
      responses:
        '200':
          description: Doctors retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    post:
      tags: [Doctors]
      operationId: createDoctor
      summary: Create a doctor profile
      description: Creates a doctor profile linked to an existing User entity. Requires Admin privileges.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDoctorRequest'
      responses:
        '201':
          description: Doctor created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /doctors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Doctor MongoDB ObjectId
        schema:
          type: string
          example: 6512bd8f12a3456789abcdef
    get:
      tags: [Doctors]
      operationId: getDoctorById
      summary: Get doctor by ID
      description: Retrieves detailed doctor record by ObjectId.
      responses:
        '200':
          description: Doctor retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [Doctors]
      operationId: updateDoctor
      summary: Update doctor profile
      description: Modifies doctor fields. Allowed for Admin or Doctor self-update.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDoctorRequest'
      responses:
        '200':
          description: Doctor updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Doctors]
      operationId: deleteDoctor
      summary: Delete doctor
      description: Deletes doctor profile. Requires Admin privileges.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Doctor deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /patients:
    get:
      tags: [Patients]
      operationId: listPatients
      summary: List patients
      description: Retrieves paginated patient records with optional filters. Requires Admin or Doctor privileges.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: doctorId
          in: query
          description: Filter patients by assigned Doctor ObjectId
          schema:
            type: string
        - name: gender
          in: query
          schema:
            type: string
            enum: [male, female, other]
      responses:
        '200':
          description: Patients retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      tags: [Patients]
      operationId: createPatient
      summary: Create patient record
      description: Registers a new patient record. Requires Admin or Doctor privileges.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Patient created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /patients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Patient MongoDB ObjectId
        schema:
          type: string
          example: 6512bd8f12a3456789abcde0
    get:
      tags: [Patients]
      operationId: getPatientById
      summary: Get patient by ID
      description: Retrieves a single patient by ID.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Patient retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [Patients]
      operationId: updatePatient
      summary: Update patient record
      description: Modifies patient demographic, doctor assignment, or medical history.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          description: Patient updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Patients]
      operationId: deletePatient
      summary: Delete patient record
      description: Removes patient record. Requires Admin privileges.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Patient deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /dashboard/stats:
    get:
      tags: [Dashboard]
      operationId: getDashboardStats
      summary: Retrieve clinical dashboard analytics
      description: Returns aggregate counts of doctors, patients, and users, alongside specialty and gender distribution breakdowns.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: HttpOnly JWT authentication cookie set upon login/register.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authorization header Bearer token for API clients.

  schemas:
    StandardResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully

    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 5

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Dr. Sarah Connor
        email:
          type: string
          format: email
          example: sarah.connor@hospital.org
        password:
          type: string
          format: password
          minLength: 6
          example: SecurePass123!
        role:
          type: string
          enum: [admin, doctor, patient]
          default: patient

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@hospital.org
        password:
          type: string
          format: password
          example: AdminPass123!

    SessionInfo:
      type: object
      required: [startedAt, idleExpiresAt, expiresAt]
      properties:
        startedAt:
          type: string
          format: date-time
          example: '2026-10-30T03:00:00.000Z'
        idleExpiresAt:
          type: string
          format: date-time
          example: '2026-10-30T03:30:00.000Z'
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-30T11:00:00.000Z'

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          example: OldPassword123!
        newPassword:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          example: newSecurePass12345678!

    User:
      type: object
      required: [id, name, email, role, version]
      properties:
        id:
          type: string
          example: 671f0a2be4c1d9a07b3e5f21
        name:
          type: string
          example: Nadia Islam
        email:
          type: string
          format: email
          example: nadia.islam@doctortracker.dev
        role:
          type: string
          enum: [admin, staff, doctor, patient]
          example: admin
        status:
          type: string
          enum: [active, disabled]
          example: active
        mustChangePassword:
          type: boolean
          example: false
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-30T06:00:00.000Z'
        version:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
