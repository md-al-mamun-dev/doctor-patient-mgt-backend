      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Too many requests. Please try again later.
            errors: []

    PreconditionFailedError:
      description: Precondition failed - Resource version mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 'Precondition failed: resource has been modified'
            errors: []

    PreconditionRequiredError:
      description: Precondition required - If-Match header missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: If-Match header is required for updates
            errors: []
